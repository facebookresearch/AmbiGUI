vision: true
max_image_dim: 768
max_tokens: 512
description: |
  Answers with the tool call directly, writing no deliberation first, so the budget only
  has to cover the call itself, and 512 leaves ample room for a verbose one. Note that
  this model cannot batch screenshots of differing shape: a pass that attaches them must
  send one request at a time, or the server aborts the whole batch.
