description: |
  Same architecture family as qwen3.5-4b, so it writes its deliberation before the call
  and the budget has to cover both. Sized for the call alone, the reply stops inside the
  reasoning, carries no call, and the step records as unparseable. The pinned Hugging Face
  revision is in configs/offline/models.yaml.
