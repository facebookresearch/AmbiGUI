# Field-by-field classification of the gold files: POINTER | OURS | DERIVED-FROM-SOURCE | MODEL-GENERATED.
# The producer and the release decision of every field are in label_provenance.yaml; where a note
# here disagrees, label_provenance.yaml wins. `evidence: internal build code` means the field was
# made by the internal research code; exact paths are kept in an internal copy of this file.
# `release` says what the public annotation files carry for it:
#   literal   = shipped as is (ours);
#   templated = every source-derived span replaced by a pointer template (build.py docstring);
#   pointer   = numbers shipped as {"$src": atom};  variable = internal path root replaced by a build-time variable.
# `stats` are measured over all rows of the internal files this release was made from, before the release
# edits (for example 3,248 recorded steps, including the OSWorld steps that do not ship); the counts of the
# released files are in manifest/trace_stats.json. Stats fields:
#   leaves, literal, templated_whole (value is one source span), templated_mixed (our words + source spans),
#   source_char_share (share of characters of templated leaves that come from the source).
# This file covers the three gold files. The fields of ambigui_online_benchmark.jsonl are listed, with their
# producers, in label_provenance.yaml only (most are the same fields as in the gold files).
# OSWorld rows ship no recorded trajectory and no click coordinates (OSWorld has its own grounding and
# environment). Row source values are mind2web, meta-gui and osworld.

