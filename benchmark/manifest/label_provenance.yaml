# Label provenance for the AmbiGUI pointer-only release. Generated; see 'about'.
about: "Producer of every label field and nested field the release ships, with evidence and a decision against the\
  \ binding approval: text-only ambiguity labels generated by Phi-4, Gemma-4-31B (gemma-4-31B-it), Muse Glimmer\
  \ or human research participants, plus a script that fetches the upstream datasets and joins them locally. NOT_APPROVED\
  \ = made by a Qwen, GLM or Qwen-based model, or by another model; UNKNOWN = the producer cannot be proven. NOT_APPROVED\
  \ and UNKNOWN values do not ship. Fields can also be left out for other reasons (owner decisions, unused constants,\
  \ OSWorld trajectory content): 'release' says what ships, 'removal' names the rules in manifest/removed_labels.json.\
  \ Provenance is kept here, not in the data rows. Row source values: mind2web, meta-gui, osworld. values_removed\
  \ is the number of values the field's removal rule(s) changed over the internal files; it is a per-rule total,\
  \ so every field covered by the same rule shows the same number. No shipped label comes from Phi-4 or Muse Glimmer."
evidence_aliases:
  internal build code: the internal research code that produced the internal files; exact paths and commits are
    kept in an internal copy of this manifest
  internal gold files / internal online file: the internal files this release was made from; their sha256 are in
    trace_stats.json -> gold_sha256
  check: a measurement over the internal files made for this manifest
  owner statement, 2026-10-23: statement by the dataset owner on 2026-10-23
owner_statements:
- date: '2026-10-23'
  statement: Annotators never saw model labels.
  used_for: human labels on the gold rows and on the 8 online rows not in the gold file
- date: '2026-10-23'
  statement: The 8 online rows not in the gold file carry human labels and are approved; keep them.
  used_for: online_human8
- date: '2026-10-23'
  statement: "open_items (questions, answers, names, basis, proposed ask windows) and open_items.windows.jsonl: Gemma-4-31B.\
    \ The shipped items are the later Gemma-4-31B version; other models were tried, and Gemma was kept."
  used_for: open_items, windows
- date: '2026-10-23'
  statement: "The 12 ask windows with window.source = recorded in the gold rows were written by hand by the owner\
    \ and the annotators. The proposed windows (window.source = proposed, and every window in open_items.windows.jsonl)\
    \ were written by Gemma-4-31B."
  used_for: windows, windows_recorded
- date: '2026-10-23'
  statement: "initial_judgement, including the rows marked synthetic=true: humans. Drop initial_judgement completely;\
    \ only the final labels ship."
  used_for: initial_judgement
- date: '2026-10-23'
  statement: Drop origin from every item and the online open_items_origin; the open items matter, not the provenance.
  used_for: eval.origin, online.origin, online.open_items_origin
- date: '2026-10-23'
  statement: "Row source values: the Mind2Web rows -> mind2web, the OSWorld rows -> osworld; meta-gui stays."
  used_for: source
- date: '2026-10-23'
  statement: OSWorld (xlang-ai/OSWorld, Apache-2.0) is the source for the 33 OSWorld rows; their recorded human
    steps do not ship.
  used_for: osworld_steps
- date: '2026-10-23'
  statement: Drop fields that no release code reads and that have the same value on every row.
  used_for: unused.*
- date: '2026-10-23'
  statement: "canonical_instruction: Gemma-4-31B. Ship only the natural-language instruction; where none can be\
    \ recovered from the reasoning, write null."
  used_for: canonical_rewrite
- date: '2026-10-23'
  statement: "The online META-GUI instruction composed from the dialogue turns: Gemma-4-31B."
  used_for: online_composed
- date: '2026-10-23'
  statement: "start_url (all rows) and transfer (verdict, judged_site, stops_at): annotated by the owner."
  used_for: online_url, online_transfer
- date: '2026-10-23'
  statement: OSWorld has its own visual grounding, so our click points make no sense to ship; keep them removed.
  used_for: osworld_ground
- date: '2026-10-23'
  statement: "Drop start_url_matches_screenshot from the online release: unused."
  used_for: online_site_identity
- date: '2026-10-23'
  statement: "Approved source datasets include Mind2Web, META-GUI and OSWorld, the three sources of this release."
  used_for: sources.yaml release_status
producer_groups:
  human_gold:
    producers:
    - human research participants, gold labelling pass
    evidence:
    - internal build code (cited in the internal copy of this manifest)
    - "internal gold files: label_provenance == human_annotated on 298/298 rows"
    - "owner statement, 2026-10-23: annotators never saw model labels"
    decision: APPROVED
    note: The labelling pass of the human annotation study (human research participants).
  human_gold_code:
    producers:
    - human research participants, gold labelling pass
    - deterministic code over those labels (no model)
    evidence:
    - internal build code (cited in the internal copy of this manifest)
    decision: APPROVED
  initial_judgement:
    producers:
    - human research participants, gold labelling pass
    evidence:
    - "owner statement, 2026-10-23: initial_judgement, including the rows marked synthetic=true, was written by\
      \ humans"
    - "owner statement, 2026-10-23: drop initial_judgement completely; only the final labels ship"
    decision: APPROVED
    note: "Not shipped (dropped by the owner): the top-level initial_judgement, gold.initial_judgements[] and the\
      \ flag derived from them."
  source:
    producers:
    - the source dataset (Mind2Web / META-GUI / OSWorld), rebuilt locally by build.py from pointers
    evidence:
    - benchmark/build.py (templates + atom hashes); manifest/pointers.jsonl; TRACE_REPORT.md section 2
    decision: APPROVED
    note: "Not a label: source content, never shipped, fetched and joined locally (the approved fetch/join script)."
  pointer:
    producers:
    - source-native id or our index into the source
    evidence:
    - manifest/pointers.jsonl; TRACE_REPORT.md section 2
    decision: APPROVED
  script_meta:
    producers:
    - "deterministic export code (no model): constants, enums, counts, path patterns"
    evidence:
    - internal build code (cited in the internal copy of this manifest)
    decision: APPROVED
  role_heuristic:
    producers:
    - deterministic punctuation rule (no model)
    evidence:
    - internal build code (cited in the internal copy of this manifest)
    - "check: the rule reproduces gold.dialogue_json[].role and turns[].role on 115/115 META-GUI rows"
    decision: APPROVED
    note: These tags come from a fixed rule; no model was involved.
  canonical_turns:
    producers:
    - human research participants, gold labelling pass (turn classifications)
    - deterministic join
    evidence:
    - "check: canonical_turn_indices == turns the annotator classed 'Original instruction' or 'Later task instruction'\
      \ on 115/115 META-GUI rows"
    - "check: canonical_instruction_raw == space-join of those source turns (94 exact, 21 whitespace-collapsed)"
    decision: APPROVED
    note: "These follow the annotators' turn classes, not a model panel."
  canonical_rewrite:
    producers:
    - Gemma-4-31B (gemma-4-31B-it)
    evidence:
    - "owner statement, 2026-10-23: canonical_instruction was written by Gemma-4-31B"
    - "owner statement, 2026-10-23: ship only the natural-language instruction; where the reasoning has no clean\
      \ final instruction, write null"
    - "internal build code: the step that wrote canonical_instruction is not in the history of the internal research\
      \ code, so the producer is taken from the owner statement above"
    decision: APPROVED
    note: "null on 9 rows whose stored value is only the model's reasoning, cut off before any final instruction\
      \ (the reasoning block never closes): 12ce19b7-794f-4cec-926a-0be4e2c8dbbe, 3rx61hoi-j63t-mss9-1bzs-l34c5w30ldr3,\
      \ 8dda0b8c-df30-4298-b27d-60c4249ebc5b, 95af2a4b-d804-41e8-b8bf-9b760f518c34, 9d892257-1700-4c65-b62e-41886ac71621,\
      \ 9e359fph-qjfn-dlqe-o38b-lyjkxxk4j22w, dd7f4c90-8f6c-4964-927c-db585aae4edb, pwoyqre2-eaqn-98f3-xr1c-lnsueq70yart,\
      \ xsj15zzb-7zja-8hls-kcsu-xmglyzylabwy."
  open_items:
    producers:
    - Gemma-4-31B (gemma-4-31B-it)
    evidence:
    - "owner statement, 2026-10-23: open_items (questions, answers, names, basis, ask windows) were made by Gemma-4-31B"
    - "owner statement, 2026-10-23: the shipped items are the later Gemma-4-31B version; other models were tried,\
      \ and Gemma was kept"
    - internal build code (cited in the internal copy of this manifest)
    decision: APPROVED
  windows:
    producers:
    - Gemma-4-31B (gemma-4-31B-it)
    evidence:
    - "owner statement, 2026-10-23: the proposed ask windows (window.source = proposed), their basis and every window\
      \ in open_items.windows.jsonl were made by Gemma-4-31B"
    - internal build code (cited in the internal copy of this manifest)
    - "internal gold files: open_items.windows.jsonl provenance == model_proposed on 313/313"
    decision: APPROVED
    note: "In the gold rows this covers the 301 windows with window.source = proposed; the 12 with window.source =\
      \ recorded are windows_recorded."
  windows_recorded:
    producers:
    - the owner and the annotators (written by hand)
    evidence:
    - "owner statement, 2026-10-23: the 12 windows with window.source = recorded were written by hand by the owner\
      \ and the annotators"
    - "check: window.source == recorded on 12 of the 313 gold open items (3 of them also in the online file)"
    decision: APPROVED
    note: "These windows give latest_step only; basis is empty and never_committed is false."
  osworld_steps:
    producers:
    - recorded human demonstration steps from a third-party copy of the OSWorld tasks, and click points from our
      grounding pipeline
    evidence:
    - "owner statement, 2026-10-23: OSWorld is the source for these rows; the recorded human steps (actions, element\
      \ names, typed text, keys, step count) are not shipped"
    - "owner statement, 2026-10-23: OSWorld has its own visual grounding, so our click points are not shipped"
    decision: APPROVED
    note: "Not shipped on OSWorld rows: they use OSWorld's own environment and grounding. Shipped unchanged on Mind2Web\
      \ and META-GUI rows."
  url_script:
    producers:
    - "deterministic script: Mind2Web website handle -> URL via a hand-checked override table and a .com fallback\
      \ (no model)"
    evidence:
    - internal build code (cited in the internal copy of this manifest)
    - "check: reproduces review_handle.url and url_confidence on 150/150 Mind2Web rows"
    decision: APPROVED
  online_from_gold:
    producers:
    - copied from the gold rows (see the gold-file entries)
    evidence:
    - internal build code (cited in the internal copy of this manifest)
    - "check: ambiguity, ambiguity_type, severity, risk, split, turns equal the gold row on 76/76 overlapping rows;\
      \ internal online file: its META-GUI open_items == gold open_items + items_from_decision_points on 39/39 (the\
      \ release splits them again into the two lists)"
    decision: APPROVED
  online_human8:
    producers:
    - a person (post-hoc annotation) on 8 Mind2Web rows not in the gold file
    evidence:
    - internal build code (cited in the internal copy of this manifest)
    - "owner statement, 2026-10-23: annotators never saw model labels; the owner reviewed and agreed with every label on these rows"
    decision: APPROVED
    note: "The owner reviewed every label on these 8 rows and agreed with each one (owner statement, 2026-10-23)."
  online_panel:
    producers:
    - a model panel, not shipped
    evidence:
    - "internal online file: panel_said / panel_reasoning hold the outputs of a model panel"
    decision: NOT_APPROVED
    note: Not written at all (key absent).
  online_composed:
    producers:
    - Gemma-4-31B (gemma-4-31B-it)
    evidence:
    - "owner statement, 2026-10-23: the META-GUI instruction composed from the dialogue turns was written by Gemma-4-31B"
    - internal build code (cited in the internal copy of this manifest)
    decision: APPROVED
  online_transfer:
    producers:
    - the owner (annotation)
    evidence:
    - "owner statement, 2026-10-23: transfer (verdict, judged_site, stops_at) was annotated by the owner"
    - internal build code (cited in the internal copy of this manifest)
    decision: APPROVED
  online_site_identity:
    producers:
    - "unknown ('a person or a model reads the frames')"
    evidence:
    - internal build code (cited in the internal copy of this manifest)
    decision: UNKNOWN
    note: "dropped: unused (owner, 2026-10-23). Not written at all."
  online_probe:
    producers:
    - deterministic probe script (Playwright Chromium; a measurement, no model)
    evidence:
    - internal build code (cited in the internal copy of this manifest)
    decision: APPROVED
  online_url:
    producers:
    - the owner (annotation)
    evidence:
    - "owner statement, 2026-10-23: start_url on all rows (including 6 Mind2Web rows whose start_url came from\
      \ a separate list of site base URLs) was annotated by the owner"
    - internal build code (cited in the internal copy of this manifest)
    decision: APPROVED
  online_step_cap:
    producers:
    - "deterministic rule of the step-cap pass of the paper runs: max_steps = 3 x recorded trajectory length"
    evidence:
    - internal build code (cited in the internal copy of this manifest)
    - "run record of the paper runs: multiple 3; web rows from the recorded steps, Android rows from the gold row's\
      \ step count"
    - "check: equals the paper runs' max_steps on 84/84 rows"
    decision: APPROVED
  online_origin:
    producers:
    - "deterministic script string describing where the items came from (dropped: provenance stays in the manifests)"
    evidence:
    - internal build code (cited in the internal copy of this manifest)
    decision: APPROVED
