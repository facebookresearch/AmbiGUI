# Which public weights answer for each model name, pinned to one Hugging Face commit.
#
# A *serve* is a running model server with an OpenAI-compatible chat API (for example
# vLLM). Every model in this evaluation is reached through one, by URL. This file says
# which weights each serve must load:
#
#   hf_id            the Hugging Face model id
#   revision         the commit hash to load (vllm serve ... --revision <revision>)
#   served_name      the name the serve must answer to (--served-model-name). For a
#                    policy this is its catalogue key. For an answerer or a judge it is
#                    the exact name the published run set recorded, because the answerer
#                    reads its token budget off that name (see docs/offline.md).
#   tensor_parallel  GPUs the weights were split over in the recorded runs (null when the
#                    recorded runs did not say). Throughput only; see docs/offline.md.
#   max_num_seqs     sequences the serve ran at once, where the recorded runs set it.
#   extra_serve_args further vLLM arguments a checkpoint needs to load at all.
#
# The revisions were read from the Hugging Face hub on 2026-10-23. The recorded runs used
# local copies of these weights whose commit was not recorded, so a revision here is the
# current one, not a verified match (docs/offline.md, "Known differences").
#
# Serve an entry with vLLM as:
#   vllm serve <hf_id> --revision <revision> --served-model-name <served_name> \
#     [--tensor-parallel-size <tensor_parallel>] [--max-num-seqs <max_num_seqs>] [<extra_serve_args>]

